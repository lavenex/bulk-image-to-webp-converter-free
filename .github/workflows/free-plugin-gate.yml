name: Verify public Free plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Check out public source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verify public package boundary
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            THIRD-PARTY-NOTICES.txt
            bulk-image-to-webp-converter.php
            readme.txt
            uninstall.php
            admin/class-biwebp-converter-admin.php
            admin/class-biwebp-history-admin.php
            admin/class-biwebp-license-admin.php
            assets/css/webp-admin.css
            assets/js/history-admin.js
            assets/js/webp-admin.js
            includes/class-biwebp-idempotency.php
            includes/class-biwebp-license.php
            includes/class-biwebp-output-validator.php
            includes/class-biwebp-usage.php
          )
          for file in "${required[@]}"; do test -f "$file"; done
          test ! -e bulk-image-to-webp-converter-pro
          test ! -e licensing-service
          ! grep -RIE 'github_pat_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BETA_FTP_PASSWORD' . \
            --exclude-dir=.git --exclude='*.yml'

      - name: Check PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify version and WordPress.org policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ \* Version:[[:space:]]+0\.8\.0-alpha$' bulk-image-to-webp-converter.php
          grep -Fq "define( 'BIWEBP_VERSION', '0.8.0-alpha' );" bulk-image-to-webp-converter.php
          grep -Fq 'Stable tag: 0.8.0-alpha' readme.txt
          grep -Fq 'Free manual conversions are unlimited.' readme.txt
          grep -Fq 'FREE_BATCH_LIMIT = 25' includes/class-biwebp-usage.php

      - name: Build checksumed beta package
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          mkdir -p "$staging/bulk-image-to-webp-converter"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec cp -R {} "$staging/bulk-image-to-webp-converter/" \;
          (cd "$staging" && zip -X -q -r "$GITHUB_WORKSPACE/bulk-image-to-webp-converter-0.8.0-alpha.zip" bulk-image-to-webp-converter)
          sha256sum bulk-image-to-webp-converter-0.8.0-alpha.zip > bulk-image-to-webp-converter-0.8.0-alpha.zip.sha256

      - name: Upload beta package
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: bulk-image-to-webp-converter-0.8.0-alpha
          path: |
            bulk-image-to-webp-converter-0.8.0-alpha.zip
            bulk-image-to-webp-converter-0.8.0-alpha.zip.sha256
          if-no-files-found: error
          retention-days: 14
